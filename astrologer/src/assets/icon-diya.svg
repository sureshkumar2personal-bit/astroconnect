<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Brass diya lamp with a golden flame">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6E2"/><stop offset="1" stop-color="#FFD9A0"/></linearGradient>
    <radialGradient id="d-glow" cx="50%" cy="42%" r="45%"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".95"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
    <linearGradient id="d-brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6C453"/><stop offset=".55" stop-color="#D99A1E"/><stop offset="1" stop-color="#A86A0C"/></linearGradient>
    <linearGradient id="d-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF8A1F"/><stop offset=".6" stop-color="#FFC233"/><stop offset="1" stop-color="#FFF3B0"/></linearGradient>
    <linearGradient id="d-lotus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3C2"/><stop offset="1" stop-color="#FFC48A"/></linearGradient>
    <path id="d-spark" d="M0-8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z"/>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#d-bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#d-glow)"/>
  <!-- lotus motif behind -->
  <g fill="url(#d-lotus)" stroke="#F2A65A" stroke-width="1.5" opacity=".9">
    <path d="M128 70 C108 96 108 128 128 156 C148 128 148 96 128 70Z"/>
    <path d="M128 92 C96 94 74 118 74 152 C104 150 124 134 128 112Z"/>
    <path d="M128 92 C160 94 182 118 182 152 C152 150 132 134 128 112Z"/>
    <path d="M128 120 C86 118 56 140 52 172 C88 176 120 160 128 138Z" opacity=".75"/>
    <path d="M128 120 C170 118 200 140 204 172 C168 176 136 160 128 138Z" opacity=".75"/>
  </g>
  <!-- flame -->
  <path d="M128 52 C146 76 150 94 140 108 C136 114 120 114 116 108 C106 94 112 76 128 52Z" fill="url(#d-flame)"/>
  <path d="M128 82 C136 92 137 100 132 106 C129 109 125 109 123 106 C119 100 121 92 128 82Z" fill="#FFF8D6"/>
  <!-- diya bowl -->
  <path d="M60 150 C62 184 90 202 128 202 C166 202 194 184 196 150 Z" fill="url(#d-brass)"/>
  <path d="M60 150 H196 C196 142 186 138 176 138 H80 C70 138 60 142 60 150Z" fill="#F6C453"/>
  <path d="M60 150 C40 148 34 140 36 132 C48 134 58 140 60 150Z" fill="url(#d-brass)"/>
  <path d="M84 168 C100 180 156 180 172 168" fill="none" stroke="#FFE08A" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <rect x="104" y="200" width="48" height="12" rx="6" fill="#A86A0C"/>
  <!-- marigold petals -->
  <g fill="#FF9A1F" opacity=".95">
    <circle cx="62" cy="214" r="9"/><circle cx="76" cy="222" r="8" fill="#FFB938"/><circle cx="196" cy="216" r="9"/><circle cx="182" cy="224" r="8" fill="#FFB938"/>
    <circle cx="48" cy="198" r="6" fill="#FFB938"/><circle cx="210" cy="200" r="6" fill="#FFB938"/>
  </g>
  <g fill="#FFFFFF" opacity=".9">
    <use href="#d-spark" transform="translate(44 62) scale(.9)"/>
    <use href="#d-spark" transform="translate(212 74) scale(.7)"/>
    <use href="#d-spark" transform="translate(196 36) scale(.5)"/>
    <use href="#d-spark" transform="translate(66 104) scale(.5)"/>
  </g>
</svg>
