if(q.dispute){const left=Math.ceil((dispDue(q)-TODAY)/DAY);after+=`<section class="card disp"><h3>Dispute Details <span class="muted sm">· raised ${fT(q.disputeAt)}</span></h3><p>${esc(q.dispute)}</p>${q.status==='Disputed'?`<p class="sm"><b class="dl">Answer by ${fT(dispDue(q))}</b> · ${left>0?left+' day(s) left':'Escalated to Admin Review'}. If not answered within 3 days, it is escalated to Admin Review.</p>`:''}</section>`}
if(q.status==='Disputed')after+=`<section class="card"><h3>Your Dispute Answer</h3><label class="sr" for="dans">Dispute answer</label><textarea id="dans" maxlength="${MAXA}" data-in="count" data-cnt="dcnt" placeholder="Reply to the user's dispute…"></textarea><div class="row sm"><span class="muted grow">Text only. No templates or attachments. You can answer once.</span><span id="dcnt">0 / ${MAXA}</span></div><label class="sm"><b>Remedy (optional)</b><textarea id="drem" class="short" placeholder="A remedy here also appears in the user's Remedy Tracker"></textarea></label><button class="btn btn-p" data-act="dispSubmit" data-id="${q.id}">Submit Dispute Answer</button></section>`;

if(q.status==='Expired')after+=`<section class="card disp"><h3>Expired</h3><p>Not answered within 30 days. Auto-cancelled on ${fD(due(q))} and the user was refunded.</p></section>`;
if(q.status==='Correction Requested')after+=`<section class="card note"><h3>Correction requested</h3><p>Waiting for the user to replace it with a General question (same slot, no extra payment). The original deadline (${fD(due(q))}) still applies.</p></section>`;
return `<div class="dhead"><h2>${q.id}</h2>${prioB(q)}${qstat(q.status)}<span class="grow"></span><span class="muted sm">Type</span>${typeB(q.type)}<span class="muted sm">Slot</span>${typeB(q.slot)}</div>
<section class="card user">${qav(q,1)}<div><b class="lg">${esc(q.name)}</b><div class="muted sm">User ID: ${q.uid}</div></div><div><span class="muted sm">Age</span><b>${q.age}</b></div><div><span class="muted sm">Gender</span><b>${q.gender}</b></div><div><span class="muted sm">Location</span><b>${esc(q.loc)}</b></div><a class="go" href="#/audience/user/${q.uid}">View Profile ›</a></section>
<div class="facts">${[['Campaign',c.name],['Amount paid · Slots',q.cat==='sub'?'Subscription benefit':inr(q.paid)+' · '+q.slots+' slot'],['Received',fT(q.recv)],['Answer deadline',isOpenQ(q)?fD(due(q))+' · '+(30-pday(q))+' days left':fD(due(q))]].map(([k,v],i)=>`<div class="fact"><span class="muted sm">${k}</span><b class="${i===3&&isOpenQ(q)?'dl':''}">${esc(v)}</b></div>`).join('')}</div>
<section class="card"><h3>Question</h3><p class="qfull">${esc(q.text)}</p><span class="muted sm">${q.text.length} / 1,000 characters</span></section>
<div class="two"><section class="card"><h3>User attachments</h3><div class="files">${q.type==='General'?'<span class="muted sm">General questions have no attachments</span>':q.files.length?q.files.map((f,i)=>`<span class="file${i===0?' horo':''}">${esc(f)}</span>`).join(''):'<span class="muted sm">None supplied</span>'}</div></section>
<section class="card"><h3>Previous questions (${q.prev.length})</h3>${q.prev.length?q.prev.map(p=>`<a class="row sm" href="#/tq/q/${p[0]}"><span class="grow">${p[0]} · ${p[1]}</span>${qstat(p[2])}</a>`).join(''):'<span class="muted sm">First question from this user</span>'}</section></div>
${corr?`<section class="card corr"><div class="grow"><b>Personal question on a General slot?</b><div class="muted sm">Ask the user to replace it with a General question. The 30-day deadline does not restart.</div></div><button class="btn btn-o" data-act="corr" data-id="${q.id}">Request Correction</button></section>`:''}
${after}<div class="actions">${isOpenQ(q)&&q.status!=='Correction Requested'?`<a class="btn btn-p" href="#/tq/answer/${q.id}">${q.draft?'Continue Answer':'Answer Now'}</a>`:''}<a class="btn btn-o" href="#/tq/timeline/${q.id}">View Timeline</a></div><p class="muted sm">There is no Cancel Question option; every submitted question must be answered.</p>`}

TQSUB.answer=id=>{const q=qById(id);return `<div class="page">${backBtn()}${PH('Write Answer',q.id+' · '+esc(q.name))}<div class="split2"><section class="sec">

<div class="note">${esc(q.text)}</div>

<label class="sr" for="ans">Your answer</label><textarea id="ans" maxlength="${MAXA}" data-in="answer" data-id="${q.id}" placeholder="Type or dictate your answer… (text only, no audio answers)">${esc(q.draft)}</textarea>
<div class="row sm"><span id="autosave" class="ok-t grow">${q.draft?'Draft saved':''}</span><span id="cnt">${q.draft.length} / ${MAXA}</span></div>
<div id="attl" class="files">${attHTML(q)}</div>
<label class="sm"><b>Prescribe remedy / atonement (optional)</b><textarea id="rem" class="short" data-in="remedy" data-id="${q.id}" placeholder="Appears in the user's Remedy Tracker">${esc(q.remedy)}</textarea></label>
<div class="actions"><button class="btn btn-o" data-act="saveDraft" data-id="${q.id}">Save Draft</button><button class="btn btn-o" data-act="previewAns" data-id="${q.id}">Preview</button><button class="btn btn-p" data-act="previewAns" data-id="${q.id}">Submit…</button></div>
<p class="muted sm">Answers can't be edited after you submit. Use Preview to review and correct first.</p></section>
<section class="sec"><h2 class="h">Live preview</h2><div class="preview" id="livepv">${pvHTML(q,q.draft)}</div></section></div></div>`};

IN.answer=t=>{const q=qById(t.dataset.id);q.draft=t.value;$('cnt').textContent=t.value.length+' / '+MAXA;$('autosave').textContent='Auto-saved just now';$('livepv').innerHTML=pvHTML(q,t.value)};

TQSUB.timeline=id=>{const q=qById(id);const ev=[['Question Purchased',fT(q.purchased),'done'],['Question Submitted',fT(q.recv),'done'],...q.events];

IN.cf=t=>{CF[t.dataset.k]=t.value;$('cfpv').innerHTML=cfPV()};IN.cfn=t=>{CF[t.dataset.k]=+t.value||0;$('cf-tot').textContent=cTot(CF);$('cfpv').innerHTML=cfPV();['G','P'].forEach(k=>{const e=$('d-'+k);if(e)e.innerHTML=discUI(k,CF[k==='G'?'gDisc':'pDisc'],CF[k==='G'?'pg':'pp'])})};

A.cfSave=()=>{const e=$('cf-err'),old=tq.campaigns.find(c=>c.id===CF.id),mx=free()+(old?cTot(old):0);
 if(!CF.name.trim())return e.textContent='Enter a campaign theme or name.';if(CF.special&&!CF.label.trim())return e.textContent='A Special Campaign needs a label.';if(!CF.G&&!CF.P)return e.textContent='Choose at least one question type.';
 if(CF.end<CF.start)return e.textContent='Expiry date must be after the start date.';if(!(cTot(CF)>0))return e.textContent='Allocate slots for the selected types.';if(cTot(CF)>mx)return e.textContent=`Only ${mx} slots are available in your monthly quota.`;
 if((CF.G&&!(CF.pg>0))||(CF.P&&!(CF.pp>0)))return e.textContent='Set a price for each selected type.';if([CF.G&&CF.gDisc,CF.P&&CF.pDisc].some(x=>x&&x.on&&!x.pct))return e.textContent='Choose a discount percentage (1–99%) or turn the discount off.';

A.cDelete=d=>{const c=cById(d.id);UI.modal('Delete Campaign',`<p><b>${esc(c.name)}</b></p><ul class="cons"><li>Submitted questions are not cancelled and must still be answered.</li><li>No refund is issued just because a campaign is deleted; a purchased unused slot stays usable until its original deadline (earlier of purchase + 7 days and the original expiry). ${pend('AP-02-24')}</li><li>Unsold allocation can be reused in your quota.</li></ul><div class="actions"><button class="btn btn-o" data-act="close">Keep Campaign</button><button class="btn danger-f" data-act="cDeleteDo" data-id="${c.id}">Delete Campaign</button></div>`)};

 const disp=tq.questions.filter(q=>q.status==='Disputed'),rcv=receivedToday('text'),crit=critical(),mx=Math.max(rcv,g,crit,1);
 const note=av.dnd?'DND is on: your whole profile is hidden and no new service can be booked or submitted. Confirmed appointments stay valid; submitted questions keep their 30-day deadlines.':av.mode===null?'DND is off. Choose Online or Offline to resume.':av.mode==='offline'?'Offline: Text Questions and Appointments can still arrive. Instant Call and Chat cannot.':'DND stops all new services. Offline still allows Text Questions and Appointments.';
 const peak=[['Morning','5:00 AM – 11:00 AM',18],['Afternoon','11:00 AM – 4:00 PM',27],['Evening','4:00 PM – 8:00 PM',41],['Night','8:00 PM – 5:00 AM',15]];
return `<div class="page">
<section class="welcome"><span class="av av-l" style="background:#F3D9A4;width:84px;height:84px;font-size:30px;border:3px solid var(--gold)">A</span><div class="grow"><h1>Good afternoon, Ananya</h1><p class="muted">You're guiding lives and creating positive change. Keep going!</p></div><span class="pill">${fD(TODAY)}</span><a class="ibtn" href="#/notifications" aria-label="Notifications, ${unread()} unread">${svg('bell',22)}${unread()?`<i>${unread()}</i>`:''}</a></section>
<div class="grid">
${sec('Availability',`${seg([['online','Online'],['offline','Offline']],av.mode,'avMode')}
<div class="row"><span class="grow">Instant Call</span>${sw(av.call,'avCall','Instant Call',av.dnd?'disabled':'')}</div><div class="row"><span class="grow">Instant Chat</span>${sw(av.chat,'avChat','Instant Chat',av.dnd?'disabled':'')}</div>
<div class="row"><span class="grow">DND (Do Not Disturb)</span>${sw(av.dnd,'avDnd','Do Not Disturb')}</div>
<button class="btn btn-o" data-act="puOpen">Planned Unavailability${av.pu&&av.pu.start?` · ${fD(av.pu.start)} – ${fD(av.pu.end)}`:''} ›</button><p class="note">${note}</p>`)}
${sec('Today\'s Earnings',`<div class="row wrap"><div class="grow"><b style="font-size:40px;font-family:'Playfair Display',serif;color:var(--link)">₹2,450</b><div class="sm">Expected net today, after commission, from today's booked work</div><span class="up">▲ +18% vs Yesterday</span></div></div><div class="grid sm">${kpi('This Week','₹14,800','<span class="up">▲ +22% vs Last Week</span>')}${kpi('This Month','₹48,500','<span class="up">▲ +15% vs Last Month</span>')}</div><span class="muted sm">This Week and This Month count completed services. Refunds appear only in <a href="#/earnings">Wallet</a>. Sample figures.</span>`,badge('Illustrative Data','ok'))}
${sec('Peak Demand Hours',`<span class="pill" style="align-self:center">Peak Time: Evening</span>${bars(peak.map(p=>p[2]),peak.map(p=>p[0]))}<div class="hlab muted" style="font-size:10.5px">${peak.map(p=>`<span>${p[1]}</span>`).join('')}</div><span class="muted sm">Last 7 days of Text Question and Appointment bookings · IST</span>`)}</div>
${sec('Today\'s Work',`<div class="grid">
<div class="card"><div class="row"><b class="grow">Appointments · ${todayA} today</b><a class="go" href="#/appointments">View All ›</a></div>${next3.map(aptRow).join('')||'<span class="muted">No upcoming appointments</span>'}</div>
<div class="card"><div class="row"><b class="grow">Text-Based Questions · today</b><a class="go" href="#/tq">Open ›</a></div><div class="grid sm" style="grid-template-columns:repeat(3,1fr)">${kpi('Received',rcv)}${kpi('Answered','<span class="ok-t">'+done+'</span>')}${kpi('Pending',pendingToday('text'))}</div>
<div class="row wrap"><span class="grow"><b>Daily Answer Goal</b> · ${done} / ${g} completed</span><label><span class="sr">Daily goal</span><select data-ch="goal">${[5,10,15].map(v=>`<option value="${v}" ${v===g?'selected':''}>${v} per day</option>`).join('')}</select></label></div><div class="row"><div class="prog grow"><span style="width:${pctG}%"></span></div><b>${pctG}%</b></div><span class="muted sm">${left?left+' more answer'+(left>1?'s':'')+' to reach today\'s goal':'Goal reached — no cap, keep going!'} · Dispute answers don't count.</span></div>
<div class="card"><div class="row"><b class="grow">Subscription Questions · today</b><a class="go" href="#/tqsub">Open ›</a></div><div class="grid sm" style="grid-template-columns:repeat(3,1fr)">${kpi('Received',receivedToday('sub'))}${kpi('Answered','<span class="ok-t">'+answeredToday('sub')+'</span>')}${kpi('Pending',pendingToday('sub'))}</div><span class="muted sm">Shown separately from Text-Based Questions · Silver 1 · Gold 3 · Platinum 4 benefit questions</span></div>
<div class="card"><b>Campaign Questions</b>${[['g-ok','Received today',rcv],['g-y','Daily goal',g],['g-r','Critical (Priority 1)',crit]].map(r=>`<div class="row sm"><span style="width:150px"><span class="dot3 ${r[0]}"></span>${r[1]}</span><div class="prog grow"><span style="width:${r[2]/mx*100}%;background:${r[0]==='g-ok'?'#22C55E':r[0]==='g-y'?'#FACC15':'#EF4444'}"></span></div><b>${r[2]}</b></div>`).join('')}</div>
<div class="card" style="border:2px solid var(--bad)"><div class="row"><b class="grow">Disputes · ${disp.length} open</b>${badge('Shown separately','bad')}</div>${disp.map(q=>`<a class="li" href="#/tq/q/${q.id}"><span class="ic">!</span><div class="grow"><b>${q.id} · ${esc(q.name)}</b><div class="muted sm">Answer by ${fT(dispDue(q))} · else Admin Review</div></div><span class="go">Dispute Details ›</span></a>`).join('')||'<span class="muted">No open disputes</span>'}</div></div>`)}
<div class="grid">${sec('Recent Activity',`${ACT.slice(0,4).map(a=>`<a class="li" href="#/${a[4]}"><span class="ic">${a[0]}</span><span class="grow">${a[1]}<div class="muted sm">${esc(a[2])}</div></span><span class="muted sm">${tm(a[3])}</span></a>`).join('')}`,`<a class="go" href="#/activity">View All ›</a>`)}
${sec('Quick Actions',`<div class="qa">${[['tq','mega','Campaign Questions'],['live','live','Go Live'],['content','edit','Content Creation'],['remedies','lotus','Remedy Tracker']].map(q=>`<a href="#/${q[0]}" ${q[0]==='tq'?'data-act="qaCampaign"':''}>${svg(q[1],30)}<span>${q[2]}</span></a>`).join('')}</div>`)}</div></div>`};
A.avMode=d=>{if(S.av.dnd)return UI.toast('Turn DND off first.');S.av.mode=d.v;rr()};
A.avDnd=()=>{if(!S.av.dnd&&CC.session)return UI.toast('Finish your ongoing Instant Call or Chat before turning on DND.');if(S.av.dnd){S.av.dnd=false;S.av.mode=null;UI.toast('DND off — choose Online or Offline.')}else{S.av.dnd=true;UI.toast('DND on — your profile is hidden from all users.')}rr()};
CH.goal=t=>{tq.goal=+t.value;rr()};
A.qaCampaign=()=>{tq.cat='text';tq.tab='received';go('tq')};
A.puOpen=()=>{const p=S.av.pu||{};UI.modal('Planned Unavailability',`<p class="sm">Same feature as DND, set for a future period. During it your profile is hidden and no new service can be booked. Confirmed appointments remain valid; closing a date with bookings is a separate <a href="#/appointments/calendar" data-act="close">appointment workflow</a>.</p><div class="form"><div class="grid2">${field('From',inp('pu1',p.start||'2026-12-10','date'),1)}${field('To',inp('pu2',p.end||'2026-12-19','date'),1)}</div><span class="muted sm">Maximum length and notice period: ${pend('AP-01-15')}</span><p id="pue" class="warn-t sm"></p></div><div class="actions">${p.start?'<button class="btn btn-o danger" data-act="puCancel">Cancel period</button>':''}<button class="btn btn-o" data-act="close">Close</button><button class="btn btn-p" data-act="puSave">${p.start?'Save changes':'Set period'}</button></div>`)};
A.puSave=()=>{const a=$('pu1').value,b=$('pu2').value;if(!a||!b||b<a)return $('pue').textContent='Choose a valid date range.';if(CC.session)return $('pue').textContent='Finish your ongoing Call/Chat first.';S.av.pu={start:a,end:b};UI.close();UI.toast('Planned Unavailability saved');rr()};
A.puCancel=()=>{S.av.pu=null;UI.close();UI.toast('Planned Unavailability cancelled');rr()};

const WIDE=false;
const UI=Object.assign({},UI0,{
 chrome(p){const t=tabOf(p);$('bnav').innerHTML=TABS5.map(x=>`<a href="#/${x[0]}" class="${t===x[0]?'on':''}" ${t===x[0]?'aria-current="page"':''}>${svg(x[2],22)}${x[1]}</a>`).join('');$('backb').hidden=TABS5.some(x=>x[0]===p)&&!CUR.a.length;UI.badge();$('bell').style.display=p==='home'?'none':'';document.title='Astro Converse — '+(TITLE[p]||'')},
 badge(){$('bell').innerHTML=svg('bell',20)+(unread()?`<i>${unread()}</i>`:'')}});
A.more=()=>UI.modal('All sections',`<div class="stack">${MORE.map(m=>`<a class="lnk" href="#/${m[0]}" data-act="moreGo" data-v="${m[0]}">${m[1]}</a>`).join('')}</div><span class="sm">${pend('AP-GL-02 placement within tabs')}</span>`);
A.moreGo=d=>{UI.close();go(d.v)};
applyTheme(S.theme);route();

</script>
</body>
</html>
