<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astro Converse — Astrologer Home</title>
    <!-- Brand emblem from the reference HTML designs; inline so no extra file or /favicon.ico request is needed. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23E2A12A' stroke-width='2'%3E%3Ccircle cx='24' cy='24' r='21' fill='%23FFF9EE'/%3E%3Ccircle cx='24' cy='24' r='14' stroke-dasharray='2 3'/%3E%3Cpath d='M24 10l3 11 11 3-11 3-3 11-3-11-11-3 11-3z' fill='%23E2A12A'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('astro-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
