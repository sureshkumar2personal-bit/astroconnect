<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AstroConnect — Web view</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=EB+Garamond:wght@400;500;600&amp;family=Jost:wght@500&amp;display=swap">
<style>
body{margin:0;background:var(--page)}
button{font-family:inherit;color:inherit;cursor:pointer}
:root{--ink:#f4efff;--muted:#cfc3ee;--subtle:#a99bd6;--em:#e8dcff;--acc:#c3a9ff;--acc2:#9a7cff;--gold:#f6c244;--green:#7ee8ab;--ctaink:#26175c;--cta1:#c3a9ff;--cta2:#e8dcff;--surf:#241a55;--sky:#1b1442;--page:#120c2e;--wrap:#0b0721;--gl:176,150,255;--ln:200,178,255;--ln2:214,196,255;--bg0:18,12,46;--gd:246,194,68;--gn:76,213,133;--tboff:#3a2d78;--toastbg:#e8dcff;--toastfg:#26175c;--red:#ffd0d0;--redb:#f6a0a0;color-scheme:dark}
:root[data-theme="light"]{--ink:#1d1440;--muted:#4a3f78;--subtle:#62578f;--em:#4a2fa8;--acc:#5a3cc0;--acc2:#7a54e6;--gold:#7a4f00;--green:#136a3a;--ctaink:#fff;--cta1:#5a3cc0;--cta2:#7a54e6;--surf:#fff;--sky:#f5f1ff;--page:#f5f1ff;--wrap:#e7e0fa;--gl:90,60,192;--ln:90,60,192;--ln2:90,60,192;--bg0:255,255,255;--gd:160,100,0;--gn:20,130,70;--tboff:#c9bdee;--toastbg:#26175c;--toastfg:#fff;--red:#a02a2a;--redb:#d46a6a;color-scheme:light}
:root[data-theme="light"] .sky{background-image:radial-gradient(900px 600px at 78% 0%,rgba(154,124,255,.2),transparent 70%),radial-gradient(800px 700px at 0% 60%,rgba(195,169,255,.25),transparent 70%);background-size:100% 100%}
:root[data-theme="light"] .card{background-color:#fff;border-color:rgba(90,60,192,.18);box-shadow:0 2px 12px rgba(60,40,140,.08)}
:root[data-theme="light"] .mphone{box-shadow:0 30px 80px rgba(60,40,140,.25),0 0 0 8px rgba(90,60,192,.08)}
.sky,.card,.btn-g,.chip,.ico,.inp{transition:background-color .25s,border-color .25s,color .25s}
.sky{background-color:var(--sky);background-image:radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.7) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 37% 7%,rgba(255,255,255,.8) 50%,transparent 51%),radial-gradient(1px 1px at 66% 14%,rgba(255,255,255,.65) 50%,transparent 51%),radial-gradient(1px 1px at 14% 61%,rgba(255,255,255,.45) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 71% 58%,rgba(255,255,255,.5) 50%,transparent 51%),radial-gradient(1px 1px at 29% 89%,rgba(255,255,255,.45) 50%,transparent 51%),radial-gradient(900px 600px at 78% 0%,rgba(122,84,230,.35),transparent 70%),radial-gradient(800px 700px at 0% 60%,rgba(90,60,192,.25),transparent 70%);background-size:380px 380px,380px 380px,380px 380px,380px 380px,380px 380px,380px 380px,100% 100%,100% 100%}
.card{background:rgba(var(--gl),.08);border:1px solid rgba(var(--ln),.22);border-radius:20px;color:var(--ink)}
.hov{transition:background-color .2s,border-color .2s,transform .15s}
.hov:hover{background-color:rgba(var(--gl),.15);border-color:rgba(var(--ln2),.5)}
.hov:active{transform:scale(.985)}
.btn-p{background-image:linear-gradient(90deg,var(--cta1),var(--cta2));color:var(--ctaink);border:0;border-radius:999px;padding:11px 24px;min-height:44px;font-size:17px;font-weight:600;transition:filter .2s,transform .15s}
.btn-p:hover{filter:brightness(1.07)}.btn-p:active{transform:scale(.97)}
.btn-g{background:transparent;border:1px solid rgba(var(--ln2),.45);color:var(--ink);border-radius:999px;padding:10px 22px;min-height:44px;font-size:17px;transition:background-color .2s}
.btn-g:hover{background-color:rgba(var(--gl),.15)}
.nv{background:transparent;border:0;color:var(--muted);padding:9px 18px;border-radius:999px;font-size:17px;min-height:44px}
.nv:hover{color:#fff;background:rgba(var(--gl),.12)}
.nv.on{background:#5a3cc0;color:#fff}
.chip{background:rgba(var(--gl),.1);border:1px solid rgba(var(--ln),.3);color:var(--em);border-radius:999px;padding:7px 16px;min-height:40px;font-size:16px;white-space:nowrap}
.chip:hover{background:rgba(var(--gl),.2)}
.chip.on{background:#5a3cc0;border-color:var(--acc2);color:#fff}
.ico{background:rgba(var(--gl),.1);border:1px solid rgba(var(--ln),.25);border-radius:999px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;gap:8px;color:var(--ink)}
.ico:hover{background:rgba(var(--gl),.2)}
.tag{display:inline-block;font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid rgba(var(--gd),.6);color:var(--gold)}
.pill{display:inline-block;font-size:14px;padding:3px 11px;border-radius:999px;font-weight:500}
.inp{width:100%;box-sizing:border-box;background:rgba(var(--bg0),.6);border:1px solid rgba(var(--ln),.35);border-radius:14px;color:var(--ink);padding:12px 16px;font-family:inherit;font-size:17px;min-height:44px}
.inp::placeholder{color:var(--subtle)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.tb{background:#5a3cc0;border:0;border-radius:999px;width:48px;height:28px;padding:3px;display:flex;align-items:center}
.tb[aria-checked="false"]{background:var(--tboff)}
.kn{width:22px;height:22px;border-radius:999px;background:#fff}
.mt{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--subtle);min-height:56px;flex:1;padding:6px 0}
.mt.on{color:var(--em)}
.mt.on svg{stroke:var(--acc)}
.mwrap{width:100%;min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:24px;background-color:var(--wrap);background-image:radial-gradient(700px 500px at 50% 0%,rgba(90,60,192,.22),transparent 70%),radial-gradient(600px 500px at 50% 100%,rgba(49,36,107,.35),transparent 70%)}
.mphone{position:relative;width:100%;max-width:390px;height:844px;max-height:calc(100vh - 48px);min-height:560px;border-radius:36px;overflow:hidden;border:1px solid rgba(var(--ln),.28);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px rgba(var(--gl),.06)}
@media (max-width:430px){.mwrap{padding:0;display:block}.mphone{max-width:none;height:100vh;height:100dvh;max-height:none;min-height:0;border-radius:0;border:0;box-shadow:none}}
.scr::-webkit-scrollbar{width:0}
</style>

<style>html,body{margin:0;background:var(--page)}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="sky" style="width:100%;min-height:100vh; color:var(--ink); font-family:'EB Garamond',Georgia,serif; font-size:17px; display:flex; flex-direction:column; overflow:hidden; position:relative">


<header style="flex:none; border-bottom:1px solid rgba(var(--ln),.22); background:rgba(var(--bg0),.7)">
<nav aria-label="Main" style="max-width:1312px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:24px">
<button onClick="{{goHome}}" style="background:none;border:0;display:flex;align-items:center;gap:12px;padding:0;min-height:44px">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 13.6 10.4 22.5 12 13.6 13.6 12 22.5 10.4 13.6 1.5 12 10.4 10.4Z" fill="var(--em)"></path><path d="M12 5.5 12.9 11.1 18.5 12 12.9 12.9 12 18.5 11.1 12.9 5.5 12 11.1 11.1Z" fill="var(--acc2)" transform="rotate(45 12 12)"></path></svg>
<span style="font-family:Jost,Futura,sans-serif;font-weight:500;font-size:24px;letter-spacing:.08em">ASTRUM</span></button>
<div style="display:flex;gap:4px;flex:1">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><button class="{{n.cls}}" onClick="{{n.go}}">{{n.label}}</button></sc-for>
</div>
<button class="ico" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}"><sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></sc-if></button>
<button class="ico" onClick="{{goWallet}}" aria-label="Wallet"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h12M16 14h2"></path></svg>₹{{wallet}}</button>
<button class="ico" onClick="{{toggleNotif}}" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"></path></svg></button>
<button class="ico" onClick="{{goProfile}}" aria-label="Profile" style="padding:0;width:44px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px">G</button>
</nav></header>



<main class="scr" style="flex:1 1 auto; min-height:0; ">
<div style="max-width:1200px; margin:0 auto; padding:32px 24px 64px; display:flex; flex-direction:column; gap:32px">

<!-- HOME -->
<sc-if value="{{sHome}}" hint-placeholder-val="{{ true }}">
<section style="position:relative; border-radius:24px; overflow:hidden; height:400px; border:1px solid rgba(var(--ln),.25)">
